name: Package Sanity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate UPM metadata, validation pack and v2 migration guards
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("com.aminhasanloo.monetization")
          package = json.loads((root / "package.json").read_text(encoding="utf-8"))

          assert package["name"] == "com.aminhasanloo.monetization"
          assert package["version"] == "2.0.0"
          assert package["unity"].startswith("6000.")
          assert package["dependencies"]["com.unity.purchasing"] == "5.4.3"

          sample_names = {sample["displayName"] for sample in package.get("samples", [])}
          assert "Monetization Demo" in sample_names
          assert "Validation Dashboard" in sample_names

          required_files = [
              Path("VALIDATION.md"),
              Path("RELEASE_CHECKLIST.md"),
              Path(".github/ISSUE_TEMPLATE/provider-validation.yml"),
              root / "Tests/Editor/AminHasanloo.Monetization.EditorTests.asmdef",
              root / "Tests/Editor/MonetizationCoreTests.cs",
              root / "Samples~/Validation/MonetizationValidationDashboard.cs",
              root / "Samples~/Validation/Editor/MonetizationValidationSceneBuilder.cs",
              root / "Samples~/Validation/README.md",
          ]
          for path in required_files:
              assert path.exists(), f"Validation Pack file missing: {path}"

          source = "\n".join(
              p.read_text(encoding="utf-8-sig", errors="ignore")
              for p in root.rglob("*.cs")
          )

          # v1 fake store shims and unsafe executable calls must not return.
          forbidden = [
              "public static class BazaarIAB",
              "public static class MyketIAB",
              "IronSource.Agent.init(",
              "IronSource.Agent.showRewardedVideo(",
              "new PaymentRequest { merchant_id",
          ]
          for token in forbidden:
              assert token not in source, f"Retired v1 implementation returned: {token}"

          assert not (root / "Plugins/Android/AndroidManifestTemplate.xml").exists(), \
              "Legacy Android store proxy manifest must remain removed"

          tests = (root / "Tests/Editor/MonetizationCoreTests.cs").read_text(encoding="utf-8")
          for test_name in [
              "ProductDefinition_UsesStoreSpecificIdAndFallsBackToCanonicalId",
              "LegacyCatalog_IsMigratedToConsumablesWhenV2CatalogIsEmpty",
              "MockIap_KnownProduct_FiresSuccessExactlyOnce",
              "MockIap_UnknownProduct_FiresFailureAndNeverSuccess",
              "MockRewardedAd_FiresOneRewardAndOneCloseCallback",
          ]:
              assert test_name in tests, f"Core validation test missing: {test_name}"

          readme = Path("README.md").read_text(encoding="utf-8")
          assert "Future Roadmap" in readme
          assert "Validation Pack" in readme
          assert "real-device/store validation" in readme

          validation = Path("VALIDATION.md").read_text(encoding="utf-8")
          assert "Stable v2.0.0 exit criteria" in validation
          assert "Google Play validation" in validation
          assert "Cafe Bazaar / Poolakey validation" in validation
          assert "AdMob validation" in validation

          print("UPM package and Validation Pack sanity checks passed.")
